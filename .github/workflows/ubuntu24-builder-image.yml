name: Publish Ubuntu 24.04 DEB builder image

on:
  workflow_dispatch:
    inputs:
      gluster_version:
        description: GlusterFS version represented by this builder image
        required: true
        type: string
      base_image:
        description: Immutable Ubuntu 24.04 base image reference
        required: false
        default: ubuntu:24.04
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: eliware-container
    steps:
      - name: Check out packaging inputs
        uses: actions/checkout@v6

      - name: Log in to Docker Hub for authenticated base-image pulls
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve immutable Ubuntu base image
        id: image
        env:
          GLUSTER_VERSION: ${{ inputs.gluster_version }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          if [[ "$BASE_IMAGE" != *@sha256:* ]]; then
            digest="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{.Manifest.Digest}}')"
            test -n "$digest"
            BASE_IMAGE="${BASE_IMAGE}@${digest}"
          fi
          base_digest="${BASE_IMAGE##*@}"
          base_short="${base_digest#sha256:}"
          date_tag="$(date -u +%Y.%m.%d)"
          image="ghcr.io/eliware/ubuntu24-gluster-builder:${GLUSTER_VERSION}-${date_tag}-noble-${base_short:0:8}"
          {
            echo "image=$image"
            echo "base_image=$BASE_IMAGE"
            echo "base_digest=$base_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          BASE_IMAGE: ${{ steps.image.outputs.base_image }}
        run: |
          set -euo pipefail
          docker build \
            --file containers/ubuntu-noble-builder.Dockerfile \
            --tag "$IMAGE" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            .

      - name: Smoke-test builder toolchain
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash "$IMAGE" -ceu '
            git --version >/dev/null
            ccache --version >/dev/null
            gcc --version >/dev/null
            make --version >/dev/null
            dpkg-buildpackage --version >/dev/null
            dpkg-scanpackages --version >/dev/null
            mk-build-deps --version >/dev/null
            node --version >/dev/null
            npm --version >/dev/null
            python3 --version >/dev/null
            apt-get --version >/dev/null
            ! dpkg-query --show glusterfs glusterfs-cli glusterfs-fuse glusterfs-client >/dev/null 2>&1
            test -x /home/runner/run.sh
            test -x /home/runner/bin/Runner.Listener
            ! ldd /home/runner/bin/Runner.Listener | grep -q "not found"
            /home/runner/bin/Runner.Listener --version >/dev/null
          '

      - name: Push builder image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"

      - name: Record immutable image result
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GLUSTER_VERSION: ${{ inputs.gluster_version }}
          BASE_IMAGE: ${{ steps.image.outputs.base_image }}
          BASE_DIGEST: ${{ steps.image.outputs.base_digest }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          mkdir -p builder-image-result
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$digest" \
            --arg gluster_version "$GLUSTER_VERSION" \
            --arg base_image "$BASE_IMAGE" \
            --arg base_digest "$BASE_DIGEST" \
            '{image: $image, digest: $digest, gluster_version: $gluster_version,
              base_image: $base_image, base_digest: $base_digest}' \
            > builder-image-result/result.json

      - name: Upload immutable image result
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-builder-image-result
          path: builder-image-result/result.json
          if-no-files-found: error
